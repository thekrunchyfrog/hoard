services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hoard-backend
    ports:
      - "5000:5000"
    restart: unless-stopped
    volumes:
      - webapp-images:/app/images
    networks:
      - hoard-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hoard-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    volumes:
      - webapp-images:/app/public/images
    networks:
      - hoard-network
    environment:
      - VITE_API_URL=http://backend:5000/api

volumes:
  webapp-images:
    driver: local

networks:
  hoard-network:
    driver: bridge
